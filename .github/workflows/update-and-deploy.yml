name: Update model and deploy site

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: taxi-minute-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked --python 3.12
      - name: Check for new TLC data and train candidate
        run: uv run python scripts/update.py
      - name: Test browser and model parity
        run: npm test
      - name: Commit approved model
        id: publish
        run: |
          git add site/model.json site/zones.json site/metadata.json models/champion.txt tests/parity_cases.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update taxi model with latest TLC data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: steps.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: steps.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy site
        id: deployment
        if: steps.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
